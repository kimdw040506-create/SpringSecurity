<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User</title>
</head>

<body>

<h1>User</h1>

<form th:action="${user.id == null} ? @{/users} : @{/users/update}"
      th:object="${user}"
      method="post">

    <input type="hidden"
           th:field="*{id}">

    <p>
        <label>Name:</label>
        <input type="text"
               th:field="*{name}"
               required>
        <span th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"></span>
    </p>

    <p>
        <label>Surname:</label>
        <input type="text"
               th:field="*{surname}"
               required>
        <span th:if="${#fields.hasErrors('surname')}"
              th:errors="*{surname}"></span>
    </p>

    <p>
        <label>Email:</label>
        <input type="email"
               th:field="*{email}"
               required>
        <span th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}"></span>
    </p>

    <button type="submit">Save</button>

</form>

<br>

<a th:href="@{/users}">
    Back to users
</a>

</body>
</html>
