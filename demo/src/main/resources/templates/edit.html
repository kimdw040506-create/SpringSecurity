<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>User</title>
</head>

<body>

<h1>User</h1>

<form th:action="${user.id == null} ? @{/admin} : @{/admin/update}"
      th:object="${user}"
      method="post">

    <input type="hidden"
           th:field="*{id}">

    <p>
        <label>Name:</label>
        <input type="text"
               th:field="*{name}"
               required>
        <span th:if="${#fields.hasErrors('name')}"
              th:errors="*{name}"></span>
    </p>

    <p>
        <label>Surname:</label>
        <input type="text"
               th:field="*{surname}"
               required>
        <span th:if="${#fields.hasErrors('surname')}"
              th:errors="*{surname}"></span>
    </p>

    <p>
        <label>Email:</label>
        <input type="email"
               th:field="*{email}"
               required>
        <span th:if="${#fields.hasErrors('email')}"
              th:errors="*{email}"></span>
    </p>

    <p>
        <label>Username:</label>
        <input type="text"
               th:field="*{username}"
               required>
        <span th:if="${#fields.hasErrors('username')}"
              th:errors="*{username}"></span>
    </p>

    <p th:if="${user.id == null}">
        <label>Password:</label>
        <input type="password"
               th:field="*{password}"
               required>
    </p>

    <p th:if="${user.id != null}">
        <label>New password:</label>
        <input type="password"
               name="newPassword">
        <small>Оставь пустым, чтобы не менять пароль</small>
    </p>

    <p>
        <label>Roles:</label>

        <select th:field="*{roles}" multiple required>
            <option th:each="role : ${roles}"
                    th:value="${role.id}"
                    th:text="${role.name}">
            </option>
        </select>
    </p>

    <button type="submit">Save</button>

</form>

<br>

<a th:href="@{/admin}">
    Back to users
</a>

<form th:action="@{/logout}" method="post">
    <button type="submit">Logout</button>
</form>

</body>
</html>
